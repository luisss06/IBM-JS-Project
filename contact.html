<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="assets/logo.svg" alt="Project Logo">
            </a>
        </div>

        <div class="menu-wrap">
            <button class="menu-btn" id="menuBtn">
                <span></span><span></span><span></span>
            </button>

            <nav id="menu">
                <a href="index.html">Home</a>
                <a href="about-us.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </div>
    </header>

    <section class="contact">
        <div>
            <h1>Contact</h1>
        </div>

        <div>
            <div class="question">Contact Us</div>

            <form class="conversation-form">

                <p>
                    Name:
                    <input type="text" class="inline-input" name="nombre" placeholder="Your name">
                </p>

                <p>
                    Country:
                    <input type="text" class="inline-input" name="empresa" placeholder="Your country">
                </p>

                <p>
                    Email:
                    <input type="email" class="inline-input" name="email" placeholder="myemail@mail.com">
                </p>

                <button type="submit" class="btn">
                    Submit
                </button>

            </form>
        </div>
    </section>


    <!-- FOOTER -->
    <footer>
        <div class=" footer-bottom">
            <p>&copy; 2026 Travel recommendation project.</p>
        </div>
    </footer>

</body>

</html>
